<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블로그 | 프레시프렙</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #2a6b3f; --green-light: #e8f5ed; --green-mid: #3d8c57;
      --cream: #faf8f3; --text: #1a1a18; --muted: #6b6b60; --border: #e2ddd4;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); line-height: 1.6; }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5vw; height: 68px;
      background: rgba(250,248,243,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); transition: box-shadow 0.3s;
    }
    nav.scrolled { box-shadow: 0 2px 20px rgba(0,0,0,0.08); }
    .nav-logo { font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; text-decoration: none; }
    .nav-logo em { font-style: normal; color: var(--green); }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { text-decoration: none; font-size: 14px; font-weight: 500; color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--green); }
    .nav-write {
      background: var(--green); color: #fff; border: none; border-radius: 50px;
      padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: background 0.2s, transform 0.15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-write:hover { background: var(--green-mid); transform: translateY(-1px); }

    /* HERO */
    .blog-hero {
      padding: 120px 5vw 60px;
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
    }
    .blog-hero .label {
      font-size: 12px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: var(--green); margin-bottom: 14px;
    }
    .blog-hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 700; line-height: 1.1; letter-spacing: -1px;
      color: var(--text); margin-bottom: 16px;
    }
    .blog-hero p { font-size: 17px; color: var(--muted); font-weight: 300; }

    /* FILTER */
    .filter-bar {
      max-width: 1100px; margin: 0 auto; padding: 0 5vw 32px;
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 500;
      border: 1.5px solid var(--border); background: #fff; cursor: pointer;
      transition: all 0.2s; color: var(--muted); font-family: inherit;
    }
    .filter-btn:hover, .filter-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .post-count { font-size: 13px; color: var(--muted); }

    /* GRID */
    .posts-grid {
      max-width: 1100px; margin: 0 auto; padding: 0 5vw 100px;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
    }

    /* CARD */
    .post-card {
      background: #fff; border-radius: 16px; border: 1px solid var(--border);
      overflow: hidden; transition: transform 0.25s, box-shadow 0.25s;
      text-decoration: none; color: inherit; display: flex; flex-direction: column;
    }
    .post-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0,0,0,0.1); }
    .card-thumb {
      height: 200px; background: linear-gradient(135deg, #a8d5b5, #6bab86);
      position: relative; overflow: hidden; flex-shrink: 0;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-category {
      position: absolute; top: 14px; left: 14px;
      background: var(--green); color: #fff;
      font-size: 11px; font-weight: 700; padding: 4px 11px; border-radius: 50px;
      letter-spacing: 0.3px;
    }
    .card-body { padding: 22px 22px 18px; flex: 1; display: flex; flex-direction: column; }
    .card-title {
      font-size: 17px; font-weight: 700; color: var(--text);
      line-height: 1.4; margin-bottom: 10px;
    }
    .card-desc {
      font-size: 14px; color: var(--muted); line-height: 1.6;
      flex: 1; margin-bottom: 16px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-meta {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; color: var(--muted);
      border-top: 1px solid #f3f4f0; padding-top: 14px; margin-top: auto;
    }
    .card-author { display: flex; align-items: center; gap: 7px; }
    .author-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--green-light); color: var(--green);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }

    /* SKELETON */
    .skeleton { background: #e5e7eb; border-radius: 8px; animation: shimmer 1.4s infinite; }
    @keyframes shimmer { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .post-card.loading .card-thumb { background: #e5e7eb; animation: shimmer 1.4s infinite; }
    .post-card.loading .card-title,
    .post-card.loading .card-desc { background: #e5e7eb; color: transparent; border-radius: 6px; animation: shimmer 1.4s infinite; }

    /* EMPTY */
    .empty-state {
      grid-column: 1/-1; text-align: center;
      padding: 80px 20px; color: var(--muted);
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
    .empty-state p { font-size: 15px; line-height: 1.7; }

    /* FOOTER */
    footer { background: var(--text); color: rgba(255,255,255,0.6); padding: 48px 5vw; text-align: center; font-size: 14px; }
    .footer-logo { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 20px; margin-bottom: 12px; }
    .footer-logo em { font-style: normal; color: #7ec99a; }
    .footer-logo span { color: #fff; }

    /* RESPONSIVE */
    @media (max-width: 900px) { .posts-grid { grid-template-columns: repeat(2, 1fr); } .nav-links { display: none; } }
    @media (max-width: 600px) { .posts-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a class="nav-logo" href="../index.html"><em>Fresh</em>Prep</a>
  <ul class="nav-links">
    <li><a href="../weekly-menu.html">메뉴</a></li>
    <li><a href="../index.html#pricing">요금제</a></li>
    <li><a href="../order-lookup.html">주문 조회</a></li>
    <li><a href="index.html" class="active">블로그</a></li>
  </ul>
  <a href="blog-editor.html" class="nav-write">✏️ 글쓰기</a>
</nav>

<!-- HERO -->
<div class="blog-hero">
  <div class="label">Blog</div>
  <h1>건강한 식탁을 위한<br/>이야기</h1>
  <p>레시피, 영양 정보, 구독 꿀팁까지 — 프레시프렙이 전하는 이야기</p>
</div>

<!-- FILTER -->
<div class="filter-bar">
  <div class="filter-group" id="filter-group">
    <button class="filter-btn active" onclick="filterPosts('전체', this)">전체</button>
  </div>
  <span class="post-count" id="post-count"></span>
</div>

<!-- GRID -->
<div class="posts-grid" id="posts-grid">
  <!-- skeleton -->
  <div class="post-card loading"><div class="card-thumb"></div><div class="card-body"><div class="card-title">　</div><div class="card-desc">　</div></div></div>
  <div class="post-card loading"><div class="card-thumb"></div><div class="card-body"><div class="card-title">　</div><div class="card-desc">　</div></div></div>
  <div class="post-card loading"><div class="card-thumb"></div><div class="card-body"><div class="card-title">　</div><div class="card-desc">　</div></div></div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-logo"><em>Fresh</em><span>Prep</span></div>
  <p>© 2026 Fresh Prep. All rights reserved.</p>
</footer>

<script>
  let allPosts = [];

  // 스크롤 nav 그림자
  window.addEventListener('scroll', () => {
    document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
  });

  // posts.json fetch
  async function loadPosts() {
    try {
      const res = await fetch('posts.json?_=' + Date.now());
      if (!res.ok) throw new Error('fetch failed');
      allPosts = await res.json();
      buildFilters();
      renderPosts(allPosts);
    } catch(e) {
      document.getElementById('posts-grid').innerHTML = `
        <div class="empty-state">
          <div class="icon">📂</div>
          <h3>posts.json을 불러올 수 없습니다</h3>
          <p>blog/ 폴더에 posts.json 파일이 있는지 확인해주세요.<br/>로컬에서 열면 CORS 문제가 발생할 수 있습니다.</p>
        </div>`;
    }
  }

  function buildFilters() {
    const categories = ['전체', ...new Set(allPosts.map(p => p.category).filter(Boolean))];
    const group = document.getElementById('filter-group');
    group.innerHTML = categories.map((c, i) =>
      `<button class="filter-btn${i===0?' active':''}" onclick="filterPosts('${c}', this)">${c}</button>`
    ).join('');
  }

  function filterPosts(cat, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtered = cat === '전체' ? allPosts : allPosts.filter(p => p.category === cat);
    renderPosts(filtered);
  }

  function renderPosts(posts) {
    const grid = document.getElementById('posts-grid');
    const count = document.getElementById('post-count');
    count.textContent = posts.length + '개의 글';

    if (!posts.length) {
      grid.innerHTML = `<div class="empty-state"><div class="icon">📝</div><h3>글이 없습니다</h3><p>아직 이 카테고리에 발행된 글이 없어요.</p></div>`;
      return;
    }

    grid.innerHTML = posts.map(p => {
      const dateStr = p.date ? p.date.replace(/-/g, '.') : '';
      const initial = (p.author || '운')[0];
      return `
        <a class="post-card" href="${esc(p.file)}">
          <div class="card-thumb">
            ${p.thumb ? `<img src="${esc(p.thumb)}" alt="${esc(p.title)}" />` : ''}
            <span class="card-category">${esc(p.category || '')}</span>
          </div>
          <div class="card-body">
            <div class="card-title">${esc(p.title)}</div>
            <div class="card-desc">${esc(p.desc || '')}</div>
            <div class="card-meta">
              <div class="card-author">
                <div class="author-avatar">${esc(initial)}</div>
                <span>${esc(p.author || '운영팀')}</span>
              </div>
              <span>${dateStr}</span>
            </div>
          </div>
        </a>`;
    }).join('');
  }

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadPosts();
</script>
</body>
</html>
