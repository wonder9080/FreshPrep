<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>블로그 에디터 | 프레시프렙</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-hover: #4338ca;
      --text-dark: #111827;
      --text-mid: #374151;
      --text-light: #6b7280;
      --text-muted: #9ca3af;
      --bg: #f7f8fb;
      --white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 4px 16px rgba(0,0,0,0.07);
      --radius: 16px;
    }
    body {
      font-family: Pretendard, 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .topbar-left { display: flex; align-items: center; gap: 16px; }
    .topbar-logo {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .topbar-divider { width: 1px; height: 20px; background: var(--border); }
    .topbar-label { font-size: 14px; color: var(--text-light); font-weight: 500; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.18s;
      text-decoration: none;
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-light);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--bg); color: var(--text-dark); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px 40px;
      width: 100%;
      max-width: 520px;
      margin-top: 60px;
    }
    .form-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 28px;
    }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 7px;
    }
    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-dark);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus {
      border-color: var(--primary);
      background: white;
    }
    .field .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 5px;
    }
    .submit-row { margin-top: 28px; }
    .submit-row .btn {
      width: 100%;
      justify-content: center;
      padding: 12px;
      font-size: 15px;
    }

    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #111827; color: white; padding: 12px 24px;
      border-radius: 999px; font-size: 14px; font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 999; white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="topbar-logo">FreshPrep</span>
    <div class="topbar-divider"></div>
    <span class="topbar-label">블로그 등록</span>
  </div>
  <div>
    <a class="btn btn-ghost" href="index.html">← 목록으로</a>
  </div>
</div>

<div class="form-card">
  <h2>새 포스트 등록</h2>

  <div class="field">
    <label>파일명 (slug)</label>
    <input type="text" id="f-slug" placeholder="예: my-first-post" />
    <div class="hint">HTML 파일명과 동일하게 입력 (확장자 제외)</div>
  </div>

  <div class="field">
    <label>제목</label>
    <input type="text" id="f-title" placeholder="포스트 제목" />
  </div>

  <div class="field">
    <label>부제목</label>
    <input type="text" id="f-subtitle" placeholder="포스트 부제목 (선택)" />
  </div>

  <div class="field">
    <label>썸네일 파일명</label>
    <input type="text" id="f-thumb" placeholder="예: thumb-01.jpg" />
    <div class="hint">이미지 파일명만 입력 (경로 제외)</div>
  </div>

  <div class="field">
    <label>작성일 (created_at)</label>
    <input type="datetime-local" id="f-created-at" />
  </div>

  <div class="submit-row">
    <button class="btn btn-primary" id="publish-btn" onclick="publishPost()">🚀 등록하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  document.getElementById('f-created-at').value =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const SUPABASE_URL = 'https://hvpxpmbcndewzeimwamd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh2cHhwbWJjbmRld3plaW13YW1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTI0NzAsImV4cCI6MjA5NjQyODQ3MH0.UTfFV0nh3SochuKNJhn1lAJo9qXTo6xuXz1sXZbdvqA';

  async function publishPost() {
    const slug      = document.getElementById('f-slug').value.trim();
    const title     = document.getElementById('f-title').value.trim();
    const subtitle  = document.getElementById('f-subtitle').value.trim();
    const thumb     = document.getElementById('f-thumb').value.trim();
    const createdAt = document.getElementById('f-created-at').value;

    if (!slug)  { showToast('파일명을 입력해주세요'); return; }
    if (!title) { showToast('제목을 입력해주세요'); return; }

    const btn = document.getElementById('publish-btn');
    btn.disabled = true;
    btn.textContent = '등록 중...';

    try {
      const payload = {
        slug,
        title,
        subtitle:   subtitle  || null,
        thumb:      thumb     || null,
        created_at: createdAt ? new Date(createdAt).toISOString() : new Date().toISOString(),
      };

      const res = await fetch(`${SUPABASE_URL}/rest/v1/posts2`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.message || res.statusText);
      }

      showToast('✓ 등록 완료!');
      ['f-slug','f-title','f-subtitle','f-thumb'].forEach(id => document.getElementById(id).value = '');

    } catch (e) {
      showToast('❌ 등록 실패: ' + e.message);
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = '🚀 등록하기';
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }
</script>
</body>
</html>
