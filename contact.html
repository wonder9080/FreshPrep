<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>문의사항</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Pretendard, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      padding: 40px 20px;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: white;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 32px;
      font-weight: 700;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .row input {
      flex: 1;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: black;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    button {
      width: fit-content;
      border: none;
      background: black;
      color: white;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    #message {
      font-size: 14px;
      margin-top: 6px;
    }

    .success {
      color: green;
    }

    .error {
      color: red;
    }

    @media (max-width: 768px) {
      .row {
        flex-direction: column;
      }

      .container {
        padding: 20px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>문의사항</h1>

    <form id="contactForm">

      <div class="row">
        <input
          type="text"
          name="first_name"
          placeholder="이름"
          required
        />

        <input
          type="text"
          name="last_name"
          placeholder="성"
        />
      </div>

      <div class="row">
        <input
          type="tel"
          name="phone"
          placeholder="전화번호"
          required
        />

        <input
          type="email"
          name="email"
          placeholder="이메일"
          required
        />
      </div>

      <textarea
        name="question"
        placeholder="문의 내용을 입력해주세요"
        required
      ></textarea>

      <button type="submit">
        제출하기 →
      </button>

      <div id="message"></div>

    </form>
  </div>

  <script>
    const form = document.getElementById("contactForm");
    const message = document.getElementById("message");

    // 본인 anon key 넣기
    const SUPABASE_URL =
      "https://rvurqydcbabmkothuspj.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dXJxeWRjYmFibWtvdGh1c3BqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTY4OTMsImV4cCI6MjA5NDczMjg5M30.t-YRYIaJAd51NnASfRVUPY2Vdc_BQUSnCupUjQfaee0";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = {
        first_name: form.first_name.value,
        last_name: form.last_name.value,
        phone: form.phone.value,
        email: form.email.value,
        question: form.question.value,
      };

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/contact`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              apikey: SUPABASE_ANON_KEY,
              Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
              Prefer: "return=minimal",
            },
            body: JSON.stringify(formData),
          }
        );

        if (!response.ok) {
          throw new Error("Failed");
        }

        message.innerHTML =
          '<div class="success">문의가 정상적으로 제출되었습니다.</div>';

        form.reset();

      } catch (error) {
        console.error(error);

        message.innerHTML =
          '<div class="error">제출 중 오류가 발생했습니다.</div>';
      }
    });
  </script>

</body>
</html>
