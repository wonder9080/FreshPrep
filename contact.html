<script>
  const form = document.getElementById("contactForm");
  const message = document.getElementById("message");

  const SUPABASE_URL = "https://rvurqydcbabmkothuspj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2dXJxeWRjYmFibWtvdGh1c3BqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNTY4OTMsImV4cCI6MjA5NDczMjg5M30.t-YRYIaJAd51NnASfRVUPY2Vdc_BQUSnCupUjQfaee0";

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = {
      first_name: form.first_name.value,
      last_name: form.last_name.value,
      phone: form.phone.value,
      email: form.email.value,
      question: form.question.value,
    };

    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/contact_forms`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
            Prefer: "return=minimal",
          },
          body: JSON.stringify(formData),
        }
      );

      if (!response.ok) {
        throw new Error("Insert failed");
      }

      message.innerHTML =
        '<div class="success">Submitted successfully.</div>';

      form.reset();

    } catch (err) {
      console.error(err);

      message.innerHTML =
        '<div class="error">Something went wrong.</div>';
    }
  });
</script>
