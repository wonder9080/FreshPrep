<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - FreshPrepMeal</title>
    <link rel="stylesheet" href="style.css"> <!-- 기존 스타일시트 유지 -->
</head>
<body>

<!-- 기존 헤더 / 네비게이션 유지 -->
<header>
    <nav>
        <a href="/">Home</a>
        <a href="/contact">Contact</a>
        <!-- 다른 메뉴 항목 -->
    </nav>
</header>

<!-- 메인 콘텐츠 영역 -->
<main class="content">
    <section class="contact-section">
        <h1>문의 사항</h1>
        
        <!-- Tally Form Embed -->
        <iframe data-tally-src="https://tally.so/embed/68W99J?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" 
                loading="lazy" 
                width="100%" 
                height="470" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0" 
                title="문의 사항 Contact">
        </iframe>

        <script>
            var d=document,
                w="https://tally.so/widgets/embed.js",
                v=function(){
                    if(typeof Tally !== "undefined") {
                        Tally.loadEmbeds();
                    } else {
                        d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){
                            e.src=e.dataset.tallySrc
                        })
                    }
                };
            if(typeof Tally !== "undefined") v();
            else if(d.querySelector('script[src="'+w+'"]')==null){
                var s=d.createElement("script");
                s.src=w;
                s.onload=v;
                s.onerror=v;
                d.body.appendChild(s);
            }
        </script>
    </section>
</main>

<!-- 기존 푸터 유지 -->
<footer>
    <p>&copy; 2026 FreshPrepMeal. All rights reserved.</p>
</footer>

</body>
</html>
